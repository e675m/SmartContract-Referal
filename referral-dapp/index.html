<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Referral DApp</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="app.js" defer></script>
</head>
<body class="bg-light text-dark">
  <div class="container py-5">
    <h1 class="mb-4 text-center">📢 Referral DApp</h1>

    <div class="text-center mb-4">
      <button class="btn btn-primary" onclick="connect()">🔗 Подключиться</button>
      <p class="mt-2">Адрес: <span id="userAddress" class="fw-bold text-break">не подключен</span></p>
    </div>

    <div id="registrationBlock" class="card p-3 mb-4 d-none">
      <h4>Регистрация</h4>
      <input type="text" id="referrerInput" class="form-control mb-2" placeholder="Адрес реферера (опционально)">
      <div class="d-flex gap-2">
        <button class="btn btn-success" onclick="register()">Зарегистрироваться</button>
        <button class="btn btn-secondary" onclick="selfRegister()">Без реферала</button>
      </div>
      <p class="mt-2" id="registerStatus"></p>
    </div>

    <div class="card p-3 mb-4">
      <h4>Информация</h4>
      <button class="btn btn-outline-primary mb-2" onclick="getMyBonus()">📊 Мой бонус</button>
      <p>Бонусы: <span id="bonusAmount">-</span></p>
      <button class="btn btn-outline-secondary mb-2" onclick="getMyReferrals()">👥 Мои приглашённые</button>
      <ul id="referralList" class="list-group"></ul>
    </div>

    <div class="card p-3 mb-4">
      <h4>Курс ETH и расчет бонуса</h4>
      <button class="btn btn-outline-info mb-2" onclick="showEthPrice()">📈 Показать курс ETH</button>
      <p>Текущий курс ETH: <span id="ethPrice">-</span> USD</p>
      <p>Ожидаемый бонус для реферера: <span id="referrerBonus">-</span> RTF</p>
      <p>Ожидаемый бонус для реферала: <span id="referralBonus">-</span> RFT</p>
    </div>

    <div id="adminContainer"></div>
  </div>
</body>
</html>
